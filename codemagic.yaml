workflows:
  android-workflow:
    name: Android Gradle Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      groups:
        - android_properties
      vars:
        JAVA_VERSION: "17"
    triggering:
      events:
        - push
    scripts:
      - name: Set up local.properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
      - name: Upgrade Gradle to 9.3.1
        script: |
          wget https://gradle.org -P /tmp
          sudo unzip -d /opt/gradle /tmp/gradle-9.3.1-bin.zip
          export PATH=/opt/gradle/gradle-9.3.1/bin:$PATH
          echo "export PATH=/opt/gradle/gradle-9.3.1/bin:\$PATH" >> $CM_ENV
      - name: Build Android APK
        script: |
          gradle assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk
