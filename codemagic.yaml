workflows:
  android-workflow:
    name: Android Gradle Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      groups:
        - android_properties
      vars:
        JAVA_VERSION: "17"
    triggering:
      events:
        - push
    scripts:
      - name: Set up local.properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
      - name: Setup and run Gradle Wrapper
        script: |
          # Используем глобальный старый gradle, чтобы он сам сгенерировал правильный wrapper 9.3.1 в проекте
          gradle wrapper --gradle-version 9.3.1
          
          # Делаем только что созданный файл запуска исполняемым
          chmod +x gradlew
      - name: Build Android APK
        script: |
          # Запускаем сборку строго через локальный wrapper, который теперь точно версии 9.3.1
          ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk
